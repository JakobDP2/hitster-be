<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster BE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    
    <style>
        /* --- 1. ALGEMENE STIJL --- */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            touch-action: manipulation; 
            display: flex; flex-direction: column; min-height: 100vh; margin: 0;
            overflow: hidden; 
        }
        
        .header { margin-top: 20px; margin-bottom: 20px; z-index: 1; }
        .header h1 { font-weight: 800; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        /* --- 2. SCANNER STIJL --- */
        #reader { 
            width: 100%; 
            max-width: 400px; 
            margin: 0 auto; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
            min-height: 350px;
            position: relative;
            z-index: 1;
        }
        
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        
        /* --- 3. CONTROLS --- */
        #controls {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .found-text { font-size: 2rem; font-weight: bold; margin-bottom: 10px; color: #1db954; }
        .card-id-text { font-size: 1.2rem; color: #888; margin-bottom: 40px; letter-spacing: 2px; }

        .big-play-btn {
            width: 200px; height: 200px; border-radius: 50%; background-color: #1db954; border: none;
            color: white; font-size: 6rem; box-shadow: 0 0 60px rgba(29, 185, 84, 0.4);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s; -webkit-tap-highlight-color: transparent; margin-bottom: 50px;
        }
        .big-play-btn:active { transform: scale(0.9); }
        .big-play-btn.paused { background-color: white; color: #1db954; box-shadow: 0 0 60px rgba(255, 255, 255, 0.3); }
        
        .btn-next {
            background: #333; color: white; border: none; border-radius: 50px; 
            padding: 20px 40px; font-size: 1.2rem; width: 80%; max-width: 300px; font-weight: bold;
        }
        .btn-next:active { background: #444; }

        .btn-spotify { background-color: #1db954; color: white; font-weight: bold; border: none; padding: 15px 30px; font-size: 1.1rem; border-radius: 50px; margin-top: 50px;}
        
        /* --- 4. STATUS EN ERROR --- */
        .status-text { 
            color: #b3b3b3; font-size: 0.9rem; margin-top: 10px; 
            transition: all 0.2s ease;
            padding: 10px; border-radius: 8px;
            min-height: 30px;
        }

        .status-error {
            color: #ff4444 !important; font-size: 1.2rem !important; font-weight: 800; text-transform: uppercase;
            background: rgba(50, 0, 0, 0.8); border: 2px solid #ff4444; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="text-center">

    <div class="header">
        <h1>🎵 HITSTER BE</h1>
    </div>

    <div id="login-section" style="display:none;">
        <p class="mt-5 text-muted">Verbind met Spotify om te starten</p>
        <button onclick="pkceLogin()" class="btn btn-spotify">Log in met Spotify</button>
    </div>

    <div id="loading-section" style="display:none; margin-top: 100px;">
        <div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="status-text" id="loading-text">Speler verbinden...</p>
    </div>

    <div id="app-section" style="display:none;">
        <div id="reader"></div>
        <div id="status" class="status-text">Richt je camera op een kaart</div>
    </div>

    <div id="controls">
        <div class="found-text">Gevonden!</div>
        <div class="card-id-text" style="visibility: hidden;">KAART #<span id="song-id-display">0</span></div>
        <button id="sdkPlayBtn" onclick="togglePlayback()" class="big-play-btn">▶️</button>
        <p class="status-text" id="player-status">Laden...</p>
        <button onclick="resetScanner()" class="btn-next">Volgende Kaart</button>
    </div>

    <script>
        var script = document.createElement('script');
        script.src = "songs.js?v=" + new Date().getTime(); 
        document.head.appendChild(script);
    </script>

    <script>
        // ================= CONFIGURATIE =================
        const clientId = "08e9f4c79ca8483c9f2ae5b434e0f60c"; 
        const redirectUri = "https://jakobdp2.github.io/hitster-be/";
        // ================================================

        let accessToken = null;
        let deviceId = null;
        let spotifyPlayer = null;
        let html5QrCode = null;
        let currentSong = null;
        let isTrackLoaded = false;
        let isPlaying = false;
        let isScanningLocked = false;
        let wakeLock = null;
        let isRecovering = false;

        // --- WAKE LOCK ---
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { console.error(`Wake Lock error: ${err.message}`); }
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });

        // --- LOGIN ---
        async function pkceLogin() {
            const generateRandomString = (length) => {
                const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let text = ''; for (let i = 0; i < length; i++) { text += possible.charAt(Math.floor(Math.random() * possible.length)); } return text;
            };
            const generateCodeChallenge = async (codeVerifier) => {
                const data = new TextEncoder().encode(codeVerifier);
                const digest = await window.crypto.subtle.digest('SHA-256', data);
                return btoa(String.fromCharCode.apply(null, new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };
            const codeVerifier = generateRandomString(128);
            localStorage.setItem('pkce_code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            const args = new URLSearchParams({
                response_type: 'code', client_id: clientId, scope: 'streaming user-read-email user-read-private user-modify-playback-state',
                redirect_uri: redirectUri, code_challenge_method: 'S256', code_challenge: codeChallenge
            });
            window.location = 'https://accounts.spotify.com/authorize?' + args;
        }

        async function handleToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                const codeVerifier = localStorage.getItem('pkce_code_verifier');
                const body = new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, client_id: clientId, code_verifier: codeVerifier });
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                    const data = await response.json();
                    if(data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        window.history.replaceState({}, document.title, "/hitster-be/"); 
                        window.location.href = redirectUri; 
                    }
                } catch(e) { console.error(e); }
            } else {
                accessToken = localStorage.getItem('access_token');
                if(accessToken) startApp(); else document.getElementById('login-section').style.display = 'block';
            }
        }

        // --- START APP ---
        function startApp() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('loading-section').style.display = 'block';
            
            document.body.addEventListener('touchstart', unlockAudio, { once: true });
            document.body.addEventListener('click', unlockAudio, { once: true });
            
            initSpotifyPlayer();
        }

        function initSpotifyPlayer() {
            window.onSpotifyWebPlaybackSDKReady = () => {
                if(spotifyPlayer) spotifyPlayer.disconnect();

                const player = new Spotify.Player({ name: 'Hitster BE', getOAuthToken: cb => { cb(accessToken); }, volume: 1.0 });

                player.addListener('ready', ({ device_id }) => {
                    console.log('Speler klaar! ID:', device_id);
                    deviceId = device_id;
                    if (isRecovering && currentSong) {
                        document.getElementById('player-status').innerText = "Hersteld! Starten...";
                        isRecovering = false;
                        transferPlayback(device_id, true);
                    } else {
                        transferPlayback(device_id, false);
                        document.getElementById('loading-section').style.display = 'none';
                        document.getElementById('app-section').style.display = 'block';
                        requestWakeLock();
                        startCamera();
                    }
                });

                player.addListener('player_state_changed', state => {
                    if (!state) return;
                    isPlaying = !state.paused;
                    
                    const btn = document.getElementById('sdkPlayBtn');
                    const statusText = document.getElementById('player-status');
                    
                    if (isPlaying) {
                        btn.innerText = "⏸️"; 
                        btn.classList.add('paused'); 
                        statusText.innerText = "";
                    } else {
                        btn.innerText = "▶️"; 
                        btn.classList.remove('paused'); 
                        if(isTrackLoaded) statusText.innerText = "Gepauzeerd (Klik om te starten)";
                    }
                });

                player.addListener('authentication_error', () => { 
                    localStorage.removeItem('access_token'); window.location.reload(); 
                });
                player.connect();
                spotifyPlayer = player;
            };
            if(window.Spotify) window.onSpotifyWebPlaybackSDKReady();
        }

        window.addEventListener('online', () => {
            if (document.getElementById('controls').style.display === 'flex') {
                document.getElementById('player-status').innerText = "Netwerk herstel... 🔄";
            }
            isRecovering = true;
            initSpotifyPlayer();
        });

        function unlockAudio() {
            const audio = new Audio();
            audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA'; 
            audio.play().catch(e => { console.log("Audio play fail", e); });
            if(spotifyPlayer) {
                spotifyPlayer.activateElement().catch(e => { console.log("Spotify activate fail", e); });
            }
        }

        async function transferPlayback(id, autoPlay) {
            await fetch('https://api.spotify.com/v1/me/player', {
                method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ "device_ids": [id], "play": false }) 
            });
            if(autoPlay) setTimeout(() => playCurrentSong(false), 500);
        }

        // --- CAMERA LOGICA MET PAUZE FUNCTIE ---
        function startCamera() {
            if (html5QrCode) return; 

            isScanningLocked = false;
            html5QrCode = new Html5Qrcode("reader");

            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                (errorMessage) => { }
            ).catch(err => {
                console.error("Camera start error", err);
                document.getElementById('status').innerText = "⚠️ Camera error. Refresh pagina.";
                document.getElementById('status').classList.add('status-error');
            });
        }

        // DE FIX: GEEN STOP, MAAR PAUZE
        function pauseCamera() {
            if (html5QrCode) {
                try {
                    html5QrCode.pause(true); // true = stop ook de video rendering
                } catch(e) {
                    console.log("Pause error", e);
                }
            }
        }

        function resumeCamera() {
            if (html5QrCode) {
                try {
                    html5QrCode.resume();
                } catch (e) {
                    console.log("Resume failed, restarting", e);
                    html5QrCode.clear().then(() => { html5QrCode = null; startCamera(); });
                }
            }
        }

        function onScanSuccess(decodedText) {
            if (isScanningLocked) return;
            const id = parseInt(decodedText);
            if (typeof songs === 'undefined') return;
            const foundSong = songs.find(s => s.id === id);
            
            if (foundSong) {
                isScanningLocked = true;
                currentSong = foundSong;
                
                // FIX: PAUZEER CAMERA IPV STOPPEN
                pauseCamera();

                document.getElementById('app-section').style.display = 'none';
                document.getElementById('controls').style.display = 'flex'; 
                document.getElementById('song-id-display').innerText = id;
                
                // Knop altijd klikbaar
                const btn = document.getElementById('sdkPlayBtn');
                btn.disabled = false; 
                
                playCurrentSong(true);
            } else {
                handleScanError("ONGELDIGE KAART!");
            }
        }

        function handleScanError(msg) {
            isScanningLocked = true;
            const statusEl = document.getElementById('status');
            const originalText = "Richt je camera op een kaart";
            statusEl.innerText = "⚠️ " + msg;
            statusEl.classList.add('status-error'); 
            if (navigator.vibrate) navigator.vibrate(200);
            setTimeout(() => {
                statusEl.innerText = originalText;
                statusEl.classList.remove('status-error'); 
                isScanningLocked = false; 
            }, 2000);
        }

        async function togglePlayback() {
            if (!isTrackLoaded) playCurrentSong(true);
            else if (spotifyPlayer) spotifyPlayer.togglePlay();
        }

        async function playCurrentSong(allowRetry) {
            const status = document.getElementById('player-status');
            const playBtn = document.getElementById('sdkPlayBtn');
            if(!deviceId) { status.innerText = "⚠️ Geen speler."; return; }
            status.innerText = "Laden...";

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000); 

            try {
                const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ uris: [`spotify:track:${currentSong.uri}`] }),
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.status === 401) {
                    localStorage.removeItem('access_token');
                    window.location.reload();
                    return;
                }
                isTrackLoaded = true;
                fetch(`https://open.spotify.com/embed/track/ID_HERE3?volume_percent=100&device_id=${deviceId}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}` } });

            } catch (e) {
                clearTimeout(timeoutId);
                if ((e.name === 'AbortError' || e.message.includes('Failed to fetch')) && allowRetry) {
                    document.getElementById('player-status').innerText = "Herstellen...";
                    isRecovering = true;
                    initSpotifyPlayer();
                } else {
                    status.innerText = "Klik op Play ▶️";
                }
            }
        }

        function resetScanner() {
            if(spotifyPlayer) spotifyPlayer.pause();
            
            document.getElementById('controls').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            
            const btn = document.getElementById('sdkPlayBtn');
            btn.innerText = "▶️";
            btn.classList.remove('paused');
            
            isTrackLoaded = false;
            isScanningLocked = false;
            isRecovering = false;
            
            // FIX: RESUME CAMERA IPV STARTEN
            resumeCamera();
        }

        handleToken();
    </script>
</body>
</html>
