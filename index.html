<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster BE DEV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    
    <style>
        /* --- STYLES --- */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            touch-action: manipulation; 
            display: flex; flex-direction: column; min-height: 100vh; margin: 0; 
            overflow: hidden; 
        }
        
        .header { margin-top: 20px; margin-bottom: 20px; z-index: 1; }
        .header h1 { font-weight: 800; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); color: #1db954; }

        /* START SCHERM */
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 9998; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .btn-start { background-color: #1db954; color: white; border: none; width: 200px; height: 200px; border-radius: 50%; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; box-shadow: 0 0 50px rgba(29, 185, 84, 0.6); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(29, 185, 84, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(29, 185, 84, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(29, 185, 84, 0); } }

        /* SCANNER */
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; min-height: 350px; position: relative; z-index: 1; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
        
        /* CONTROLS CONTAINER */
        #controls { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #121212; z-index: 9999; 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            padding: 20px; box-sizing: border-box; 
        }
        
        .found-text { font-size: 2.5rem; font-weight: 900; margin-bottom: 20px; color: #1db954; text-transform: uppercase; letter-spacing: 2px; }
        .card-id-text { font-size: 1.2rem; color: #888; margin-bottom: 40px; letter-spacing: 2px; }
        
        .big-play-btn { 
            width: 220px; height: 220px; border-radius: 50%; 
            background-color: #1db954; border: none; color: white; 
            font-size: 7rem; box-shadow: 0 0 60px rgba(29, 185, 84, 0.4); 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.2s; 
            -webkit-tap-highlight-color: transparent; 
            margin-bottom: 30px; 
        }
        .big-play-btn:active { transform: scale(0.95); }
        .big-play-btn.paused { background-color: white; color: #1db954; box-shadow: 0 0 60px rgba(255, 255, 255, 0.3); }
        
        /* STATUS BOX */
        #status-box {
            width: 100%; max-width: 350px;
            height: 60px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px;
            border-radius: 10px;
            transition: background-color 0.3s;
            padding: 0 10px;
        }
        
        .status-text { 
            font-size: 1.1rem; font-weight: bold; color: white;
            text-align: center; width: 100%; margin: 0; line-height: 1.2;
        }

        .status-normal { background-color: transparent; }
        .status-warning { background-color: #ff9800; color: #000; box-shadow: 0 0 15px rgba(255, 152, 0, 0.4); animation: pulse-warning 2s infinite; } /* Oranje: Waarschuwing (Geen internet) */
        .status-error { background-color: #f44336; color: white; box-shadow: 0 0 15px rgba(244, 67, 54, 0.4); } /* Rood: FATAL (Refresh nodig) */

        @keyframes pulse-warning { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        .btn-next { 
            background: #333; color: white; border: none; border-radius: 50px; 
            padding: 20px 40px; font-size: 1.2rem; width: 80%; max-width: 300px; 
            font-weight: bold; transition: all 0.3s; 
        }
        .btn-next:active { background: #444; }
        
        .btn-disabled { 
            opacity: 0.2 !important; pointer-events: none !important; filter: grayscale(100%) !important;
            border: none !important; box-shadow: none !important;
        }

        .btn-spotify { background-color: #1db954; color: white; font-weight: bold; border: none; padding: 15px 30px; font-size: 1.1rem; border-radius: 50px; margin-top: 50px;}
        
        #loading-text { font-size: 1.2rem; color: #b3b3b3; margin-top: 20px; }
    </style>
</head>
<body class="text-center">

    <div class="header"><h1>🎵 HITSTER BE DEV</h1></div>
    <div id="login-section" style="display:none;"><p class="mt-5 text-muted">Verbind met Spotify om te starten</p><button onclick="pkceLogin()" class="btn btn-spotify">Log in met Spotify</button></div>
    <div id="loading-section" style="display:none; margin-top: 100px;"><div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status"></div><p id="loading-text">Speler verbinden...</p></div>
    
    <div id="start-screen"><button class="btn-start" onclick="startGame()">START<br>SPEL</button></div>
    
    <div id="app-section" style="display:none;"><div id="reader"></div><div id="status" class="status-text mt-3">Richt je camera op een kaart</div></div>
    
    <div id="controls">
        <div class="found-text">GEVONDEN!</div>
        <div class="card-id-text" style="visibility: hidden;">KAART #<span id="song-id-display">0</span></div>
        
        <button id="sdkPlayBtn" onclick="togglePlayback()" class="big-play-btn">▶️</button>
        
        <div id="status-box" class="status-normal">
            <p id="player-status" class="status-text"></p>
        </div>
        
        <button id="btnNext" onclick="resetScanner()" class="btn-next">VOLGENDE KAART</button>
    </div>

    <script>
        var script = document.createElement('script');
        script.src = "songs.js?v=" + new Date().getTime(); 
        document.head.appendChild(script);
    </script>

    <script>
        function log(msg) { console.log(msg); }

        const clientId = "08e9f4c79ca8483c9f2ae5b434e0f60c"; 
        const redirectUri = "https://jakobdp2.github.io/hitster-be/";

        let accessToken = null, deviceId = null, spotifyPlayer = null, html5QrCode = null;
        let currentSong = null, isTrackLoaded = false, isPlaying = false, isScanningLocked = false;
        let wakeLock = null;
        let hasGameStarted = false;
        let isOfflineMode = false;
        let watchdogTimer = null; // De Timer

        // Auto-refresh na 2 min inactiviteit
        let lastVisibilityChange = Date.now();

        async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        
        document.addEventListener('visibilitychange', async () => { 
            if (document.visibilityState === 'visible') {
                const now = Date.now();
                if (now - lastVisibilityChange > 120000) { 
                    window.location.reload(); // Harde reset als we lang weg waren
                    return;
                }
                requestWakeLock();
                lastVisibilityChange = now;
            } else {
                lastVisibilityChange = Date.now();
            }
        });

        // --- AUTH ---
        async function pkceLogin() {
            const generateRandomString = (length) => { const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let text = ''; for (let i = 0; i < length; i++) { text += possible.charAt(Math.floor(Math.random() * possible.length)); } return text; };
            const generateCodeChallenge = async (codeVerifier) => { const data = new TextEncoder().encode(codeVerifier); const digest = await window.crypto.subtle.digest('SHA-256', data); return btoa(String.fromCharCode.apply(null, new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
            const codeVerifier = generateRandomString(128); localStorage.setItem('pkce_code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            const args = new URLSearchParams({ response_type: 'code', client_id: clientId, scope: 'streaming user-read-email user-read-private user-modify-playback-state', redirect_uri: redirectUri, code_challenge_method: 'S256', code_challenge: codeChallenge });
            window.location = 'https://accounts.spotify.com/authorize?' + args;
        }

        async function handleToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                const codeVerifier = localStorage.getItem('pkce_code_verifier');
                const body = new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, client_id: clientId, code_verifier: codeVerifier });
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                    const data = await response.json();
                    if(data.access_token) { localStorage.setItem('access_token', data.access_token); window.history.replaceState({}, document.title, "/hitster-be/"); window.location.href = redirectUri; }
                } catch(e) {}
            } else {
                accessToken = localStorage.getItem('access_token');
                if(accessToken) startApp(); else document.getElementById('login-section').style.display = 'block';
            }
        }

        function startApp() { document.getElementById('login-section').style.display = 'none'; document.getElementById('loading-section').style.display = 'block'; initSpotifyPlayer(); }

        // --- UI HELPERS ---
        function setStatusMessage(msg, type = 'normal') {
            const box = document.getElementById('status-box');
            const text = document.getElementById('player-status');
            
            text.innerText = msg;
            box.className = ''; 
            
            if (type === 'error') { // FATAL ERROR (ROOD)
                box.classList.add('status-error'); 
            } else if (type === 'warning') { // WAARSCHUWING (ORANJE)
                box.classList.add('status-warning');
            } else { // NORMAAL (TRANSPARANT)
                box.classList.add('status-normal'); 
            }
        }

        function disableControls(disabled) {
            const playBtn = document.getElementById('sdkPlayBtn');
            const nextBtn = document.getElementById('btnNext');
            
            if (disabled) {
                playBtn.classList.add('btn-disabled');
                nextBtn.classList.add('btn-disabled');
            } else {
                playBtn.classList.remove('btn-disabled');
                nextBtn.classList.remove('btn-disabled');
            }
        }

        function updateUIState(playing) {
            const btn = document.getElementById('sdkPlayBtn');
            // Alleen UI updaten als we NIET in fatal error mode zitten
            const box = document.getElementById('status-box');
            if (box.classList.contains('status-error')) return;

            if (playing) { 
                btn.innerText = "⏸️"; btn.classList.add('paused'); 
                if(!isOfflineMode) setStatusMessage("", 'normal'); 
            } else { 
                btn.innerText = "▶️"; btn.classList.remove('paused'); 
                if(isTrackLoaded && !isOfflineMode) setStatusMessage("Gepauzeerd", 'normal'); 
            }
        }

        // --- FATAL ERROR STATE ---
        function triggerFatalError() {
            setStatusMessage("HERLAAD DE PAGINA ↻", 'error'); // ROOD
            disableControls(true); // Alles op slot
            // Eventueel watchdog stoppen om dubbele triggers te voorkomen
            if(watchdogTimer) clearTimeout(watchdogTimer);
        }

        // --- NETWORK HANDLERS (TERUG NAAR DE BASIS) ---
        window.addEventListener('offline', () => {
            log("Netwerk verloren...");
            isOfflineMode = true; 
            if(document.getElementById('controls').style.display === 'flex') {
                // GEWOON WAARSCHUWEN (ORANJE), NIET CRASHEN
                setStatusMessage("⚠️ GEEN INTERNET", 'warning');
                disableControls(true);
            }
        });

        window.addEventListener('online', () => {
            log("Netwerk terug!");
            isOfflineMode = false;
            // Knoppen terug open, maar we doen verder niks bijzonders
            disableControls(false);

            if(hasGameStarted && spotifyPlayer) {
                setStatusMessage("Verbinding OK", 'normal');
                // Check status
                spotifyPlayer.getCurrentState().then(state => {
                   if(state && !state.paused) updateUIState(true);
                   else updateUIState(false);
                });
            }
        });

        // --- SPELER ---
        function initSpotifyPlayer() {
            if(window.Spotify && spotifyPlayer) { try { spotifyPlayer.disconnect(); } catch(e) { } }

            window.onSpotifyWebPlaybackSDKReady = () => {
                const player = new Spotify.Player({ name: 'Hitster BE', getOAuthToken: cb => { cb(accessToken); }, volume: 1.0 });

                player.addListener('ready', ({ device_id }) => {
                    deviceId = device_id;
                    document.getElementById('loading-section').style.display = 'none';

                    if (hasGameStarted) {
                        transferPlayback(device_id, false);
                    } else {
                        document.getElementById('start-screen').style.display = 'flex';
                        transferPlayback(device_id, false);
                    }
                });

                player.addListener('authentication_error', () => { localStorage.removeItem('access_token'); window.location.reload(); });
                
                player.addListener('player_state_changed', state => {
                    if (!state || isOfflineMode) return;
                    isPlaying = !state.paused;
                    updateUIState(isPlaying);
                });

                player.connect();
                spotifyPlayer = player;
            };
            if(window.Spotify) window.onSpotifyWebPlaybackSDKReady();
        }

        function startGame() {
            hasGameStarted = true;
            const audio = new Audio(); audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA'; audio.play().catch(e => {});
            if(spotifyPlayer) spotifyPlayer.activateElement();
            requestWakeLock();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            startCamera();
        }

        async function transferPlayback(id, autoPlay) {
            await fetch('https://api.spotify.com/v1/me/player', { method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ "device_ids": [id], "play": autoPlay }) });
        }

        function startCamera() {
            if (html5QrCode) return; isScanningLocked = false; html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, (e) => {}).catch(err => { 
                const statusEl = document.getElementById('status');
                statusEl.innerText = "⚠️ Camera Error"; statusEl.classList.add('status-camera-error');
            });
        }
        function pauseCamera() { if (html5QrCode) { try { html5QrCode.pause(true); } catch(e) {} } }
        function resumeCamera() { if (html5QrCode) { try { html5QrCode.resume(); } catch (e) { html5QrCode.clear().then(() => { html5QrCode = null; startCamera(); }); } } }

        function onScanSuccess(decodedText) {
            if (isScanningLocked) return;
            const id = parseInt(decodedText);
            if (typeof songs === 'undefined') return;
            const foundSong = songs.find(s => s.id === id);
            
            if (foundSong) {
                isScanningLocked = true; currentSong = foundSong;
                pauseCamera();
                document.getElementById('app-section').style.display = 'none';
                document.getElementById('controls').style.display = 'flex'; 
                document.getElementById('song-id-display').innerText = id;
                document.getElementById('sdkPlayBtn').disabled = false; 
                playCurrentSong(true);
            } else { handleScanError("ONGELDIGE KAART!"); }
        }

        function handleScanError(msg) {
            isScanningLocked = true; const statusEl = document.getElementById('status'); statusEl.innerText = "⚠️ " + msg; statusEl.classList.add('status-camera-error'); 
            if (navigator.vibrate) navigator.vibrate(200);
            setTimeout(() => { statusEl.innerText = "Richt je camera op een kaart"; statusEl.classList.remove('status-camera-error'); isScanningLocked = false; }, 2000);
        }

        // --- PLAYBACK ---
        async function togglePlayback() { 
            if(document.getElementById('status-box').classList.contains('status-error')) return; // Slot erop
            
            if (!isTrackLoaded || !deviceId) {
                playCurrentSong(true);
            } else if (spotifyPlayer) {
                spotifyPlayer.togglePlay().catch(e => { playCurrentSong(true); });
            }
        }

        async function playCurrentSong(allowRetry) {
            // Als we offline zijn: Toon Oranje waarschuwing en stop
            if(isOfflineMode) { 
                setStatusMessage("⚠️ GEEN INTERNET", 'warning'); 
                return; 
            }
            
            // Als we geen deviceId hebben (zombie sessie): ROOD
            if(!deviceId) { 
                triggerFatalError(); 
                return; 
            }
            
            setStatusMessage("Laden...", 'normal');

            // --- DE TIMER ---
            // We starten de timer voordat we iets doen.
            if(watchdogTimer) clearTimeout(watchdogTimer);
            
            watchdogTimer = setTimeout(() => {
                // Als deze timer afgaat, betekent het dat we nog niet 'geslaagd' zijn.
                log("Watchdog: TIJD IS OP. CRASHEN MAAR.");
                triggerFatalError();
            }, 4000); // 4 seconden

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000); 

            try {
                const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ uris: [`spotify:track:${currentSong.uri}`] }),
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!res.ok) {
                    // Als server zegt "Nee" -> Fataal
                    if (res.status === 401) { localStorage.removeItem('access_token'); window.location.reload(); return; }
                    throw new Error(`Spotify Error: ${res.status}`);
                }
                
                // HOERA! We zijn er. Timer onschadelijk maken.
                clearTimeout(watchdogTimer);
                
                isTrackLoaded = true; 

            } catch (e) {
                clearTimeout(timeoutId);
                // Ook bij een error mag de timer uit, want we handelen het hier af
                clearTimeout(watchdogTimer);
                
                // Als we hier komen, is de fetch mislukt (bv. offline terwijl we dachten online te zijn)
                // Dit is dus een zombie sessie -> FATAAL
                triggerFatalError();
            }
        }

        function resetScanner() {
            if(spotifyPlayer) spotifyPlayer.pause();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            updateUIState(false);
            isTrackLoaded = false;
            // Zeker zijn dat timer uit is
            if(watchdogTimer) clearTimeout(watchdogTimer);
            isScanningLocked = false; 
            resumeCamera();
        }

        handleToken();
    </script>
</body>
</html>
