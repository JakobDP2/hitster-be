<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster BE (PKCE)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border: 2px solid #1db954; border-radius: 10px; overflow: hidden; }
        .btn-spotify { background-color: #1db954; color: white; font-weight: bold; border: none; padding: 12px; font-size: 1.1rem; width: 100%; margin-bottom: 10px;}
        .card-custom { background-color: #282828; border: 1px solid #444; margin-top: 20px; padding: 30px 20px; border-radius: 15px;}
        .big-play-btn {
            width: 100px; height: 100px; border-radius: 50%; background-color: #1db954; border: none; color: white; font-size: 2.5rem;
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.6); margin: 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .big-play-btn:disabled { background-color: #555; cursor: wait; }
    </style>
</head>
<body class="text-center p-3">

    <h1 class="mb-4">🎵 Hitster BE</h1>

    <div id="login-section">
        <p>Log in met Spotify (PKCE Mode)</p>
        <button onclick="pkceLogin()" class="btn btn-spotify">Log in</button>
    </div>

    <div id="app-content" style="display:none;">
        <div id="reader"></div>
        <div id="status" class="mt-3 text-muted">Speler verbinden...</div>
        
        <div id="controls" class="card-custom" style="display:none;">
            <h3 class="text-success">Gevonden!</h3>
            <p class="text-muted small">ID: <span id="song-id-display"></span></p>
            <button id="sdkPlayBtn" onclick="playCurrentSong()" class="big-play-btn">▶️</button>
            <p class="text-muted small" id="player-status">Klik om te starten</p>
            <button onclick="resetScanner()" class="btn btn-secondary w-100 mt-4">Volgende</button>
        </div>
    </div>

    <script src="songs.js"></script> 

    <script>
        // --- CONFIGURATIE ---
        const clientId = "08e9f4c79ca8483c9f2ae5b434e0f60c"; // JOUW ID
        const redirectUri = "http://127.0.0.1:5500/index.html"; // EXACT ZO IN DASHBOARD ZETTEN

        // --- PKCE HELPER FUNCTIES (Dit is de "nieuwe" manier) ---
        function generateRandomString(length) {
            let text = '';
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            function base64encode(string) {
                return btoa(String.fromCharCode.apply(null, new Uint8Array(string)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return base64encode(digest);
        }

        // --- 1. START LOGIN ---
        async function pkceLogin() {
            const codeVerifier = generateRandomString(128);
            const codeChallenge = await generateCodeChallenge(codeVerifier);

            // Sla verifier op voor stap 2
            localStorage.setItem('pkce_code_verifier', codeVerifier);

            const scope = 'streaming user-read-email user-read-private user-modify-playback-state';
            const authUrl = new URL("https://accounts.spotify.com/authorize");

            const params = {
                response_type: 'code', // LET OP: 'code', geen 'token'!
                client_id: clientId,
                scope: scope,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                redirect_uri: redirectUri
            };

            authUrl.search = new URLSearchParams(params).toString();
            window.location.href = authUrl.toString();
        }

        // --- 2. VERWERK LOGIN (Na redirect) ---
        async function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                // We hebben een code! Nu omwisselen voor een token
                const codeVerifier = localStorage.getItem('pkce_code_verifier');
                
                const body = new URLSearchParams({
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: redirectUri,
                    client_id: clientId,
                    code_verifier: codeVerifier
                });

                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body
                    });
                    const data = await response.json();
                    
                    if(data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        // Maak URL schoon
                        window.history.replaceState({}, document.title, window.location.pathname);
                        startApp(data.access_token);
                    } else {
                        alert("Fout bij token ophalen: " + JSON.stringify(data));
                    }
                } catch(e) { console.error(e); }
            } else {
                // Check of we al een token hadden
                const token = localStorage.getItem('access_token');
                if(token) startApp(token);
            }
        }

        // --- 3. START APP ---
        let deviceId = null;
        let html5QrcodeScanner = null;
        let currentSong = null;

        function startApp(token) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';

            // SDK Starten
            window.onSpotifyWebPlaybackSDKReady = () => {
                const player = new Spotify.Player({
                    name: 'Hitster BE Player',
                    getOAuthToken: cb => { cb(token); },
                    volume: 0.8
                });

                player.addListener('ready', ({ device_id }) => {
                    console.log('Ready with Device ID', device_id);
                    deviceId = device_id;
                    document.getElementById('status').innerText = "Scan een kaart...";
                    initScanner();
                });

                player.addListener('authentication_error', () => {
                    console.log("Token verlopen");
                    localStorage.removeItem('access_token');
                    window.location.reload();
                });

                player.connect();
            };
            
            // Trigger SDK als hij al geladen was
            if(window.Spotify) window.onSpotifyWebPlaybackSDKReady();
        }

        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            const id = parseInt(decodedText);
            currentSong = songs.find(s => s.id === id);
            
            if (currentSong) {
                document.getElementById('controls').style.display = 'block';
                document.getElementById('reader').style.display = 'none';
                document.getElementById('song-id-display').innerText = id;
            } else {
                alert("QR niet gevonden!");
                initScanner();
            }
        }

        async function playCurrentSong() {
            if(!deviceId) return alert("Speler nog niet klaar...");
            const token = localStorage.getItem('access_token');
            
            await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                method: 'PUT',
                body: JSON.stringify({ uris: [`spotify:track:${currentSong.uri}`] }),
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
            });
            document.getElementById('player-status').innerText = "Gestart!";
        }

        function resetScanner() {
            document.getElementById('controls').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            document.getElementById('player-status').innerText = "Klik om te starten";
            initScanner();
        }

        // Start alles
        handleRedirect();

    </script>
</body>
</html>
