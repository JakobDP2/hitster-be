<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster BE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border: 2px solid #1db954; border-radius: 10px; overflow: hidden; }
        
        .btn-spotify { background-color: #1db954; color: white; font-weight: bold; border: none; padding: 12px; font-size: 1.1rem; width: 100%; margin-bottom: 10px;}
        .card-custom { background-color: #282828; border: 1px solid #444; margin-top: 20px; padding: 30px 20px; border-radius: 15px;}

        /* De GROTE PLAY KNOP */
        .big-play-btn {
            width: 120px; height: 120px;
            border-radius: 50%;
            background-color: #1db954;
            border: none;
            color: white;
            font-size: 3rem;
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.6);
            transition: transform 0.1s;
            margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
        }
        .big-play-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="text-center p-3">

    <h1 class="mb-4">🎵 Hitster BE</h1>

    <div id="login-section" style="display:none;">
        <p>Om de afstandsbediening te gebruiken moet je eenmalig inloggen.</p>
        <button onclick="authorizeSpotify()" class="btn btn-spotify">Log in met Spotify</button>
    </div>

    <div id="app-section" style="display:none;">
        <div id="reader"></div>
        <div id="status" class="mt-3 text-muted">Scan een kaart...</div>
    </div>

    <div id="controls" class="card-custom" style="display:none;">
        <h3 class="text-success">Kaart Gevonden!</h3>
        <p class="text-muted small">ID: <span id="song-id-display"></span></p>
        
        <button id="remotePlayBtn" onclick="playSongViaAPI()" class="big-play-btn">▶️</button>
        <p class="text-muted small" id="play-status">Klik om af te spelen op je telefoon</p>

        <button onclick="resetScanner()" class="btn btn-secondary w-100 mt-4">Volgende Kaart</button>
    </div>

    <script src="songs.js"></script> 

    <script>
        // --- 1. CONFIGURATIE (VUL DIT IN!) ---
        const clientId = "08e9f4c79ca8483c9f2ae5b434e0f60c"; // <--- PLAK HIER JE CODE
        // De link moet EXACT matchen met wat je in het dashboard hebt gezet
        // Als je lokaal test met Live Server, gebruik: http://127.0.0.1:5500/index.html
        // Als je live gaat, gebruik: https://jouwnaam.github.io/hitster-be/
        // TIP: Gebruik window.location.href om het dynamisch te maken (zorg dat de / klopt in dashboard)
        const redirectUri = window.location.href.split('?')[0]; 
        
        // --- 2. AUTHENTICATIE LOGICA ---
        let accessToken = null;

        function checkLogin() {
            // Check of we net terugkomen van Spotify met een token in de URL
            const hash = window.location.hash;
            if (hash && hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                accessToken = params.get('access_token');
                window.location.hash = ''; // Maak URL schoon
                localStorage.setItem('spotify_token', accessToken); // Onthoud token
            } else {
                // Check of we nog een oude token hebben
                accessToken = localStorage.getItem('spotify_token');
            }

            if (accessToken) {
                document.getElementById('app-section').style.display = 'block';
                startScanner();
            } else {
                document.getElementById('login-section').style.display = 'block';
            }
        }

        function authorizeSpotify() {
            // Rechten die we nodig hebben: 'user-modify-playback-state' is cruciaal
            const scope = 'user-modify-playback-state user-read-playback-state';
            let url = 'https://accounts.spotify.com/authorize';
            url += '?response_type=token';
            url += '&client_id=' + encodeURIComponent(clientId);
            url += '&scope=' + encodeURIComponent(scope);
            url += '&redirect_uri=' + encodeURIComponent(redirectUri);
            
            window.location = url; // Redirect de gebruiker
        }

        // --- 3. SCAN LOGICA ---
        let html5QrcodeScanner;
        let currentSong = null;

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear(); 
            const id = parseInt(decodedText);
            currentSong = songs.find(s => s.id === id);

            if (currentSong) {
                document.getElementById('app-section').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                document.getElementById('song-id-display').innerText = id;
            } else {
                alert("QR Code niet gevonden!");
                resetScanner();
            }
        }

        // --- 4. DE AFSTANDSBEDIENING (API) ---
        async function playSongViaAPI() {
            if (!accessToken) return authorizeSpotify();
            
            const btn = document.getElementById('remotePlayBtn');
            const status = document.getElementById('play-status');
            btn.disabled = true; // Even uitschakelen om dubbelklik te voorkomen
            
            try {
                // We sturen een signaal naar Spotify: "Speel dit nummer"
                const response = await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "uris": [`spotify:track:${currentSong.uri}`]
                    })
                });

                if (response.status === 404 || response.status === 403) {
                    // Geen actieve speler gevonden
                    status.innerText = "⚠️ Open de Spotify App eerst op je telefoon!";
                    status.style.color = "orange";
                } else if (response.status === 401) {
                    // Token verlopen
                    authorizeSpotify(); 
                } else {
                    status.innerText = "✅ Muziek gestart!";
                    status.style.color = "#1db954";
                }
            } catch (e) {
                console.error(e);
                status.innerText = "Er ging iets mis.";
            }
            
            setTimeout(() => btn.disabled = false, 1000);
        }

        function resetScanner() {
            document.getElementById('controls').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('play-status').innerText = "Klik om af te spelen";
            document.getElementById('play-status').style.color = "#6c757d";
            startScanner();
        }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        // Start alles
        checkLogin();
    </script>
</body>
</html>
