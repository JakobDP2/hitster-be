<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster BE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    
    <style>
        /* Algemene Styling */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            touch-action: manipulation; 
            display: flex; flex-direction: column; min-height: 100vh;
        }
        
        .header { margin-bottom: 20px; margin-top: 10px; }
        .header h1 { font-weight: 800; letter-spacing: -1px; }

        /* Scanner Styling */
        #reader { 
            width: 100%; 
            max-width: 400px; 
            margin: 0 auto; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }
        
        /* Het camera icoontje wit maken met een filter */
        #reader img[alt="Info icon"] { display: none; } /* Verberg info icon */
        #reader img[src*="camera"] { filter: invert(1); opacity: 0.8; } 

        /* Verberg de lelijke tekst en linkjes van de scanner library */
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink { display: none !important; }
        
        /* Maak de permissie knop mooi */
        #reader__dashboard_section_csr button {
            background-color: #1db954;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 50px; /* Duw hem naar het midden */
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }

        /* Knoppen en Kaarten */
        .btn-spotify { background-color: #1db954; color: white; font-weight: bold; border: none; padding: 15px; font-size: 1.1rem; width: 100%; margin-bottom: 10px; border-radius: 50px;}
        .card-custom { background-color: #181818; border: none; margin-top: 20px; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);}

        .big-play-btn {
            width: 120px; height: 120px;
            border-radius: 50%;
            background-color: #1db954;
            border: none;
            color: white;
            font-size: 3rem;
            box-shadow: 0 0 40px rgba(29, 185, 84, 0.4);
            margin: 30px auto;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .big-play-btn:active { transform: scale(0.9); }
        .big-play-btn.paused { background-color: white; color: #1db954; } /* Wit als hij speelt */
        
        /* Status tekstjes */
        .status-text { color: #b3b3b3; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body class="text-center p-3">

    <div class="header">
        <h1>🎵 HITSTER BE</h1>
    </div>

    <div id="login-section" style="display:none; margin-top: 50px;">
        <p class="mb-4 text-muted">Verbind met Spotify om te starten</p>
        <button onclick="pkceLogin()" class="btn btn-spotify" style="max-width: 300px;">Log in met Spotify</button>
    </div>

    <div id="loading-section" style="display:none; margin-top: 100px;">
        <div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="status-text">Speler verbinden...</p>
    </div>

    <div id="app-section" style="display:none;">
        <div id="reader"></div>
        <div id="status" class="status-text">Richt je camera op een kaart</div>
    </div>

    <div id="controls" class="card-custom" style="display:none;">
        <h2 class="text-white mb-1">Gevonden!</h2>
        <p class="text-muted small">Kaart #<span id="song-id-display"></span></p>
        
        <button id="sdkPlayBtn" onclick="togglePlayback()" class="big-play-btn" disabled>▶️</button>
        <p class="status-text" id="player-status">Laden...</p>

        <button onclick="resetScanner()" class="btn btn-secondary w-100 mt-4" style="background: #333; border: none; border-radius: 50px; padding: 15px;">Volgende Kaart</button>
    </div>

    <script src="songs.js"></script> 

    <script>
        // ================= CONFIGURATIE =================
        const clientId = "08e9f4c79ca8483c9f2ae5b434e0f60c"; // JOUW ID
        const redirectUri = "https://jakobdp2.github.io/hitster-be/"; // JOUW URL
        // ================================================

        let accessToken = null;
        let deviceId = null;
        let spotifyPlayer = null;
        let html5QrcodeScanner = null;
        let currentSong = null;
        let isTrackLoaded = false;
        let isPlaying = false;

        async function pkceLogin() {
            const generateRandomString = (length) => {
                const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let text = '';
                for (let i = 0; i < length; i++) { text += possible.charAt(Math.floor(Math.random() * possible.length)); }
                return text;
            };
            const generateCodeChallenge = async (codeVerifier) => {
                const data = new TextEncoder().encode(codeVerifier);
                const digest = await window.crypto.subtle.digest('SHA-256', data);
                return btoa(String.fromCharCode.apply(null, new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };

            const codeVerifier = generateRandomString(128);
            localStorage.setItem('pkce_code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            const scope = 'streaming user-read-email user-read-private user-modify-playback-state';
            
            const args = new URLSearchParams({
                response_type: 'code', client_id: clientId, scope: scope, redirect_uri: redirectUri,
                code_challenge_method: 'S256', code_challenge: codeChallenge
            });
            window.location = 'https://accounts.spotify.com/authorize?' + args;
        }

        async function handleToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                const codeVerifier = localStorage.getItem('pkce_code_verifier');
                const body = new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, client_id: clientId, code_verifier: codeVerifier });
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                    const data = await response.json();
                    if(data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        window.location.href = redirectUri; 
                    }
                } catch(e) { console.error(e); }
            } else {
                accessToken = localStorage.getItem('access_token');
                if(accessToken) startApp(); else document.getElementById('login-section').style.display = 'block';
            }
        }

        function startApp() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('loading-section').style.display = 'block';

            document.body.addEventListener('touchstart', unlockAudio, { once: true });
            document.body.addEventListener('click', unlockAudio, { once: true });

            window.onSpotifyWebPlaybackSDKReady = () => {
                const player = new Spotify.Player({
                    name: 'Hitster BE Mobile',
                    getOAuthToken: cb => { cb(accessToken); },
                    volume: 1.0
                });

                player.addListener('ready', ({ device_id }) => {
                    console.log('Ready with Device ID', device_id);
                    deviceId = device_id;
                    transferPlayback(device_id); 
                    
                    document.getElementById('loading-section').style.display = 'none';
                    document.getElementById('app-section').style.display = 'block';
                    initScanner();
                });

                player.addListener('player_state_changed', state => {
                    if (!state) return;
                    isPlaying = !state.paused;
                    const btn = document.getElementById('sdkPlayBtn');
                    const statusText = document.getElementById('player-status');
                    
                    if (isPlaying) {
                        btn.innerText = "⏸️"; 
                        btn.classList.add('paused');
                        statusText.innerText = "Nu aan het spelen";
                        statusText.style.color = "#1db954";
                    } else {
                        btn.innerText = "▶️";
                        btn.classList.remove('paused');
                        statusText.innerText = "Gepauzeerd";
                        statusText.style.color = "#b3b3b3";
                    }
                });

                player.addListener('authentication_error', () => { localStorage.removeItem('access_token'); window.location.reload(); });
                player.connect();
                spotifyPlayer = player;
            };
            if(window.Spotify) window.onSpotifyWebPlaybackSDKReady();
        }

        function unlockAudio() {
            const audio = new Audio();
            audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA'; 
            audio.play().catch(e => {});
            if(spotifyPlayer) spotifyPlayer.activateElement(); 
        }

        async function transferPlayback(id) {
            await fetch('https://api.spotify.com/v1/me/player', {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ "device_ids": [id], "play": false }) 
            });
        }

        function initScanner() {
            if(html5QrcodeScanner) return;
            
            // CONFIG: Alleen QR codes scannen, geen bestanden uploaden
            const config = { 
                fps: 10, 
                qrbox: 250,
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] 
            };
            
            html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            const id = parseInt(decodedText);
            currentSong = songs.find(s => s.id === id);
            
            if (currentSong) {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.clear().then(() => {
                        html5QrcodeScanner = null;
                        isTrackLoaded = false;
                        document.getElementById('app-section').style.display = 'none';
                        document.getElementById('controls').style.display = 'block';
                        document.getElementById('song-id-display').innerText = id;
                        
                        const btn = document.getElementById('sdkPlayBtn');
                        btn.disabled = false;
                        
                        playCurrentSong();
                    }).catch(err => console.log(err));
                }
            } else {
                alert("QR niet gevonden!");
            }
        }

        async function togglePlayback() {
            if (!isTrackLoaded) {
                playCurrentSong();
            } else {
                if (spotifyPlayer) spotifyPlayer.togglePlay();
            }
        }

        async function playCurrentSong() {
            const btn = document.getElementById('sdkPlayBtn');
            const status = document.getElementById('player-status');
            
            if(!deviceId) { status.innerText = "⚠️ Geen speler."; return; }
            status.innerText = "Laden...";
            
            try {
                await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ uris: [`spotify:track:${currentSong.uri}`] }),
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
                });
                isTrackLoaded = true;
                fetch(`https://open.spotify.com/embed/track/ID_HERE3?volume_percent=100&device_id=${deviceId}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}` } });
            } catch (e) {
                console.error(e);
                status.innerText = "Foutje.";
            }
        }

        function resetScanner() {
            if(spotifyPlayer) spotifyPlayer.pause();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            
            const btn = document.getElementById('sdkPlayBtn');
            btn.innerText = "▶️";
            btn.classList.remove('paused');
            
            isTrackLoaded = false;
            initScanner();
        }

        handleToken();
    </script>
</body>
</html>
