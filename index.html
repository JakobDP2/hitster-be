<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster BE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; touch-action: manipulation; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border: 2px solid #1db954; border-radius: 10px; overflow: hidden; }
        
        .btn-spotify { background-color: #1db954; color: white; font-weight: bold; border: none; padding: 15px; font-size: 1.2rem; width: 100%; margin-bottom: 10px; border-radius: 30px;}
        .card-custom { background-color: #282828; border: 1px solid #444; margin-top: 20px; padding: 30px 20px; border-radius: 15px;}

        /* De Play Knop - Geoptimaliseerd voor touch */
        .big-play-btn {
            width: 120px; height: 120px;
            border-radius: 50%;
            background-color: #1db954;
            border: none;
            color: white;
            font-size: 3rem;
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.6);
            margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* Verwijdert grijze klik-box op iPhone */
        }
        .big-play-btn:active { transform: scale(0.95); background-color: #1ed760; }
        .big-play-btn:disabled { background-color: #555; cursor: wait; box-shadow: none; }
    </style>
</head>
<body class="text-center p-3">

    <h1 class="mb-4">🎵 Hitster BE</h1>

    <div id="login-section" style="display:none;">
        <p>Log in met Spotify Premium</p>
        <button onclick="pkceLogin()" class="btn btn-spotify">Log in</button>
    </div>

    <div id="loading-section" style="display:none;">
        <div class="spinner-border text-success mb-3" role="status"></div>
        <p id="loading-text">Speler verbinden...</p>
    </div>

    <div id="app-section" style="display:none;">
        <div id="reader"></div>
        <div id="status" class="mt-3 text-muted">Even geduld, speler start op...</div>
    </div>

    <div id="controls" class="card-custom" style="display:none;">
        <h3 class="text-success">Gevonden!</h3>
        <p class="text-muted small">ID: <span id="song-id-display"></span></p>
        
        <button id="sdkPlayBtn" onclick="playCurrentSong()" class="big-play-btn" disabled>▶️</button>
        <p class="text-muted small" id="player-status">Wacht op verbinding...</p>

        <button onclick="resetScanner()" class="btn btn-secondary w-100 mt-4">Volgende</button>
    </div>

    <script src="songs.js"></script> 

    <script>
        // --- CONFIGURATIE ---
        const clientId = "08e9f4c79ca8483c9f2ae5b434e0f60c"; // JOUW CLIENT ID
        const redirectUri = "https://jakobdp2.github.io/hitster-be/"; // JOUW GITHUB URL

        let accessToken = null;
        let deviceId = null;
        let spotifyPlayer = null;
        let html5QrcodeScanner = null;
        let currentSong = null;

        // --- AUTH ---
        async function pkceLogin() {
            // (Zelfde code als voorheen...)
            const generateRandomString = (length) => {
                const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                let text = '';
                for (let i = 0; i < length; i++) { text += possible.charAt(Math.floor(Math.random() * possible.length)); }
                return text;
            };
            const generateCodeChallenge = async (codeVerifier) => {
                const data = new TextEncoder().encode(codeVerifier);
                const digest = await window.crypto.subtle.digest('SHA-256', data);
                return btoa(String.fromCharCode.apply(null, new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };

            const codeVerifier = generateRandomString(128);
            localStorage.setItem('pkce_code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);
            const scope = 'streaming user-read-email user-read-private user-modify-playback-state';
            
            const args = new URLSearchParams({
                response_type: 'code', client_id: clientId, scope: scope, redirect_uri: redirectUri,
                code_challenge_method: 'S256', code_challenge: codeChallenge
            });
            window.location = 'https://accounts.spotify.com/authorize?' + args;
        }

        async function handleToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                const codeVerifier = localStorage.getItem('pkce_code_verifier');
                const body = new URLSearchParams({ grant_type: 'authorization_code', code: code, redirect_uri: redirectUri, client_id: clientId, code_verifier: codeVerifier });
                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                    const data = await response.json();
                    if(data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        window.location.href = redirectUri; 
                    }
                } catch(e) { console.error(e); }
            } else {
                accessToken = localStorage.getItem('access_token');
                if(accessToken) startApp(); else document.getElementById('login-section').style.display = 'block';
            }
        }

        // --- APP START ---
        function startApp() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('loading-section').style.display = 'block';

            // CRUCIAAL: Unlock Audio bij eerste interactie
            document.body.addEventListener('touchstart', unlockAudio, { once: true });
            document.body.addEventListener('click', unlockAudio, { once: true });

            window.onSpotifyWebPlaybackSDKReady = () => {
                const player = new Spotify.Player({
                    name: 'Hitster BE Mobile',
                    getOAuthToken: cb => { cb(accessToken); },
                    volume: 1.0 // Volume op max
                });

                player.addListener('ready', ({ device_id }) => {
                    console.log('Ready with Device ID', device_id);
                    deviceId = device_id;
                    transferPlayback(device_id); // Maak actief
                    document.getElementById('loading-section').style.display = 'none';
                    document.getElementById('app-section').style.display = 'block';
                    document.getElementById('status').innerText = "🟢 Klaar! Scan nu.";
                    initScanner();
                });

                player.addListener('authentication_error', () => { localStorage.removeItem('access_token'); window.location.reload(); });
                player.connect();
                spotifyPlayer = player;
            };
            if(window.Spotify) window.onSpotifyWebPlaybackSDKReady();
        }

        // TRUCJE: Speel stilte af om iOS audio te activeren
        function unlockAudio() {
            // We maken een dummy audio element aan
            const audio = new Audio();
            // Korte stilte
            audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA'; 
            audio.play().catch(e => console.log("Audio unlock failed (mogelijk al unlocked)", e));
            
            // Probeer ook de Spotify Player te 'activeren'
            if(spotifyPlayer) spotifyPlayer.activateElement(); 
        }

        async function transferPlayback(id) {
            await fetch('https://api.spotify.com/v1/me/player', {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ "device_ids": [id], "play": false }) 
            });
        }

        function initScanner() {
            if(html5QrcodeScanner) return;
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            const id = parseInt(decodedText);
            currentSong = songs.find(s => s.id === id);
            
            if (currentSong) {
                document.getElementById('app-section').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                document.getElementById('song-id-display').innerText = id;
                document.getElementById('player-status').innerText = "Klik voor muziek";
                
                // Schakel knop in
                const btn = document.getElementById('sdkPlayBtn');
                btn.disabled = false;
            } else {
                alert("QR niet gevonden!");
                initScanner();
            }
        }

        async function playCurrentSong() {
            // Nog een keer audio unlocken voor de zekerheid
            unlockAudio();
            
            const btn = document.getElementById('sdkPlayBtn');
            const status = document.getElementById('player-status');
            btn.disabled = true;

            if(!deviceId) { status.innerText = "⚠️ Geen speler. Refresh."; return; }

            status.innerText = "Laden...";
            
            try {
                await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ uris: [`spotify:track:${currentSong.uri}`] }),
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
                });
                status.innerText = "🎶 Muziek speelt!";
                status.style.color = "#1db954";
                
                // EXTRA: Zet volume op max via API
                fetch(`https://open.spotify.com/embed/track/ID_HERE3?volume_percent=100&device_id=${deviceId}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

            } catch (e) {
                console.error(e);
                status.innerText = "Foutje.";
            }
            setTimeout(() => btn.disabled = false, 2000);
        }

        function resetScanner() {
            if(spotifyPlayer) spotifyPlayer.pause();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('status').innerText = "Scan een kaart...";
            initScanner();
        }

        handleToken();
    </script>
</body>
</html>
