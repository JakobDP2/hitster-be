<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster BE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; }
        
        /* Scanner styling */
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border: 2px solid #1db954; border-radius: 10px; overflow: hidden; }
        
        /* Algemene UI styling */
        .btn-secondary { background-color: #555; border: none; padding: 15px; width: 100%; font-size: 1.1rem; border-radius: 50px;}
        .card-custom { background-color: #282828; border: 1px solid #444; margin-top: 20px; padding: 40px 20px; border-radius: 15px;}

        /* --- DE GROTE SLEUTELGAT SPELER --- */
        .player-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .player-window {
            width: 100px;       
            height: 100px;      
            /*overflow: hidden;*/
            border-radius: 50%;
            border: 4px solid #1db954;
            background-color: #000;
            position: relative;
            box-shadow: 0 0 30px rgba(29, 185, 84, 0.6); 
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .player-window:active {
            transform: scale(0.95); /* Klein bounce effectje bij klikken */
        }

        /* JOUW FIJNE AFSTELLING */
        iframe {
            position: absolute;
            border: none;
            width: 350px; 
            height: 80px;
            transform: scale(2);            /* Lekker groot */
            transform-origin: center right; 
            top: -26px;                     /* Jouw settings */
            right: -2.5px;                  /* Jouw settings */
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="text-center p-3">

    <h1 class="mb-4">🎵 Hitster BE</h1>

    <div id="reader"></div>
    <div id="status" class="mt-3 text-muted">Scan een kaart...</div>

    <div id="controls" class="card-custom" style="display:none;">
        
        <div class="player-container">
            <div class="player-window" id="embed-window">
                </div>
        </div>

        <p class="text-muted small mb-4">Kaart ID: <span id="song-id-display"></span></p>

        <button onclick="resetScanner()" class="btn btn-secondary">Volgende Kaart</button>
    </div>

    <script src="songs.js"></script> 

    <script>
        let html5QrcodeScanner;
        let currentSong = null;

        function onScanSuccess(decodedText) {
            // 1. Stop direct de camera
            html5QrcodeScanner.clear(); 
            
            const id = parseInt(decodedText);
            currentSong = songs.find(s => s.id === id);

            if (currentSong) {
                // 2. Update de UI
                document.getElementById('status').innerText = "Gevonden!";
                document.getElementById('controls').style.display = 'block';
                document.getElementById('song-id-display').innerText = id;
                
                // 3. Laad direct de speler (klaar voor de klik)
                loadPlayerNow();
                
            } else {
                alert("QR Code " + decodedText + " niet gevonden!");
                resetScanner();
            }
        }

        function loadPlayerNow() {
            const container = document.getElementById('embed-window');
            const spotifyUrl = `https://open.spotify.com/embed/track/${currentSong.uri}?utm_source=generator&theme=0`;
            
            container.innerHTML = `
                <iframe src="${spotifyUrl}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="eager"></iframe>
            `;
        }

        function resetScanner() {
            document.getElementById('controls').style.display = 'none';
            document.getElementById('embed-window').innerHTML = ""; 
            document.getElementById('status').innerText = "Scan een kaart...";
            startScanner();
        }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        startScanner();
    </script>
</body>
</html>
